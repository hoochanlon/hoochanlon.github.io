<article class="home-page">
  {{ with .Title }}
    <header class="home-page__header">
      <h1 class="home-page__greeting">{{ . | emojify }}</h1>
    </header>
  {{ end }}
  <section class="home-page__body">{{ .Content | emojify }}</section>
</article>
<section>
  {{ partial "featured-articles.html" . }}
  {{ partial "recent-articles.html" . }}
</section>
