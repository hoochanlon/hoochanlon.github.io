  mainSections = ["posts"]
  description = "记录人文科学分析与生活日常的数字花园"

[params.author]
  name = "Hoochanlon"
  displayName = "Hoochanlon"
  displayNameCard = "胡成龙"
  image = "img/author.jpg"
  headline = ""
  bio = "生田绘梨花、桥本奈奈未粉丝"
  links = [
    { github = "https://github.com/hoochanlon" },
    { email = "mailto:hoochanlon@outlook.com" },
    { twitter = "https://hoochanlon.github.io/twitter/?owner=hoochanlon&repo=twitter" },
    { wechat = "img/wexin.jpg" },
  ]

  [params.author.status]
    # 如需自定义 SVG，取消注释并填写 assets/ 下的路径
    icon = "icons/to-the-moon.svg"
